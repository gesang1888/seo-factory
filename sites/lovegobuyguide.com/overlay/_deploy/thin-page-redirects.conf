# Platform opt 2026-10-26: consolidate coupons.html + public JSON/dataset
# Note: /lovegobuy-coupons/ and /coupons/ already in gsc-redirects.conf → /lovegobuy-coupon/
location = /coupons.html { return 301 https://lovegobuyguide.com/lovegobuy-coupon/; }

location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/lovegobuyguide.com/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/lovegobuyguide.com/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
