# 301 every satellite host onto the canonical .net host, preserving path + query.

server {
    listen 80;
    listen 443 ssl;
    server_name usfansspreadsheet.uk www.usfansspreadsheet.uk;
    return 301 https://usfansspreadsheet.net$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name usfansspreadsheet.co.uk www.usfansspreadsheet.co.uk;
    return 301 https://usfansspreadsheet.net$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name usfansspreadsheet.nl www.usfansspreadsheet.nl;
    return 301 https://usfansspreadsheet.net$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name usfansspreadsheet.org www.usfansspreadsheet.org;
    return 301 https://usfansspreadsheet.net$request_uri;
}
