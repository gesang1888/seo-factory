# Step 3 + platform opt 2026-10-26: customs + coupons aliases + public JSON/dataset
location = /blog/posts/rizzitgo-customs-guide { return 301 https://rizzitgospreadsheets.net/rizzitgo-shipping-guide/; }
location = /blog/posts/rizzitgo-customs-guide/ { return 301 https://rizzitgospreadsheets.net/rizzitgo-shipping-guide/; }
location = /coupons.html { return 301 https://rizzitgospreadsheets.net/rizzitgo-coupons/; }
location = /coupons/ { return 301 https://rizzitgospreadsheets.net/rizzitgo-coupons/; }
location = /rizzitgo-coupon/ { return 301 https://rizzitgospreadsheets.net/rizzitgo-coupons/; }
location = /rizzitgo-coupon { return 301 https://rizzitgospreadsheets.net/rizzitgo-coupons/; }

location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/rizzitgospreadsheets.net/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/rizzitgospreadsheets.net/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
location ^~ /rizzitgo-coupons/ {
  try_files $uri $uri/ /rizzitgo-coupons/index.html;
}
