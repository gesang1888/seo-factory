# Platform opt 2026-10-26: coupons.html alias + public JSON
# Note: /coupons and /coupons/ already in gsc-redirects.conf → /litbuy-coupons/
location = /coupons.html { return 301 https://litbuyspreadsheet.eu/litbuy-coupons/; }
location = /litbuy-coupons.html { return 301 https://litbuyspreadsheet.eu/litbuy-coupons/; }

# Static dataset + truth JSON
location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/litbuyspreadsheet.eu/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/litbuyspreadsheet.eu/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
