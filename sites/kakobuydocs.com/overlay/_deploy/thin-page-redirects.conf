# Platform opt 2026-10-26: consolidate coupons.html + public JSON/dataset
# Note: /coupons/ already 301→ /kakobuy-coupons/
location = /coupons.html { return 301 https://kakobuydocs.com/kakobuy-coupons/; }

location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/kakobuydocs.com/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/kakobuydocs.com/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
