# WeMimi platform opt — thin coupons + JSON aliases (CMS uses /data/ runtime)
location = /coupons.html {
    return 301 https://wemimi.net/wemimi-coupons/;
}
location = /coupons {
    return 301 https://wemimi.net/wemimi-coupons/;
}
location = /coupons/ {
    return 301 https://wemimi.net/wemimi-coupons/;
}
location = /wemimi-coupon {
    return 301 https://wemimi.net/wemimi-coupons/;
}
location = /wemimi-coupon/ {
    return 301 https://wemimi.net/wemimi-coupons/;
}
location = /wemimi-coupons {
    return 301 https://wemimi.net/wemimi-coupons/;
}
location ^~ /wemimi-coupons/ {
    try_files $uri $uri/ /wemimi-coupons/index.html;
}
location ^~ /finds-dataset/ {
    try_files $uri $uri/ /finds-dataset/index.html;
}
location = /data/finds-dataset.json {
    default_type application/json;
    alias /www/wwwroot/wemimi.net/wm-data/finds-dataset.json;
}
location = /data/coupons-truth.json {
    default_type application/json;
    alias /www/wwwroot/wemimi.net/wm-data/coupons-truth.json;
}
