# HubBuy platform opt — thin coupons + JSON aliases (CMS uses /data/ runtime)
location = /coupons.html {
    return 301 https://hubbuy.net/hubbuy-coupons/;
}
location = /coupons {
    return 301 https://hubbuy.net/hubbuy-coupons/;
}
location = /coupons/ {
    return 301 https://hubbuy.net/hubbuy-coupons/;
}
location = /hubbuy-coupon {
    return 301 https://hubbuy.net/hubbuy-coupons/;
}
location = /hubbuy-coupon/ {
    return 301 https://hubbuy.net/hubbuy-coupons/;
}
location = /hubbuy-coupons {
    return 301 https://hubbuy.net/hubbuy-coupons/;
}
location ^~ /hubbuy-coupons/ {
    try_files $uri $uri/ /hubbuy-coupons/index.html;
}
location ^~ /finds-dataset/ {
    try_files $uri $uri/ /finds-dataset/index.html;
}
location = /data/finds-dataset.json {
    default_type application/json;
    alias /www/wwwroot/hubbuy.net/hb-data/finds-dataset.json;
}
location = /data/coupons-truth.json {
    default_type application/json;
    alias /www/wwwroot/hubbuy.net/hb-data/coupons-truth.json;
}
