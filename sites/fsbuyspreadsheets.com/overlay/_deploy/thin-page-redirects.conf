# Step 3 2026-10-26: thin shipping/customs cleanup (deduped against gsc-redirects)
location = /blog/posts/fsbuy-customs-guide { return 301 https://fsbuyspreadsheets.com/fsbuy-shipping-guide/; }
location = /blog/posts/fsbuy-customs-guide/ { return 301 https://fsbuyspreadsheets.com/fsbuy-shipping-guide/; }
location = /shipping { return 301 https://fsbuyspreadsheets.com/fsbuy-shipping-guide/; }
location = /shipping/ { return 301 https://fsbuyspreadsheets.com/fsbuy-shipping-guide/; }

# Platform opt 2026-10-26: coupons aliases + public JSON/dataset
# Brand hub only — no country desks; do not revive Phase C sunsets / 410 twin.
location = /coupons.html { return 301 https://fsbuyspreadsheets.com/fsbuy-coupons/; }
location = /coupons/ { return 301 https://fsbuyspreadsheets.com/fsbuy-coupons/; }
location = /coupons { return 301 https://fsbuyspreadsheets.com/fsbuy-coupons/; }
location = /fsbuy-coupon/ { return 301 https://fsbuyspreadsheets.com/fsbuy-coupons/; }
location = /fsbuy-coupon { return 301 https://fsbuyspreadsheets.com/fsbuy-coupons/; }

location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/fsbuyspreadsheets.com/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/fsbuyspreadsheets.com/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
location ^~ /fsbuy-coupons/ {
  try_files $uri $uri/ /fsbuy-coupons/index.html;
}
