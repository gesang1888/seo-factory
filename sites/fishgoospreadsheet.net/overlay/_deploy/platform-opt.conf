# FishGoo platform opt 2026-10-26 — coupons money URL + JSON/dataset
# Brand hub only — no country desks; do not revive Phase C sunsets.
# NOTE: also patch ia-collapse.conf (drop fishgoo-coupons→/coupons/ rewrite)
# and retarget gsc-redirects /coupons → /fishgoo-coupons/ (exact locations win first-match).

location = /coupons.html { return 301 https://fishgoospreadsheet.net/fishgoo-coupons/; }
location = /fishgoo-coupon { return 301 https://fishgoospreadsheet.net/fishgoo-coupons/; }
location = /fishgoo-coupon/ { return 301 https://fishgoospreadsheet.net/fishgoo-coupons/; }
location = /fishgoo-coupons { return 301 https://fishgoospreadsheet.net/fishgoo-coupons/; }
location = /fishgoo-invite-code { return 301 https://fishgoospreadsheet.net/fishgoo-coupons/; }
location = /fishgoo-invite-code/ { return 301 https://fishgoospreadsheet.net/fishgoo-coupons/; }

location ^~ /fishgoo-coupons/ {
  try_files $uri $uri/ /fishgoo-coupons/index.html;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/fishgoospreadsheet.net/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/fishgoospreadsheet.net/data/coupons-truth.json;
}
