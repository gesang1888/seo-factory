location ^~ /wd-img/ {
    resolver 1.1.1.1 ipv6=off;
    resolver_timeout 5s;

    if ($uri !~* "^/wd-img/si\.geilicdn\.com/") {
        return 403;
    }

    rewrite ^/wd-img/si\.geilicdn\.com/(.*)$ /$1 break;
    proxy_pass https://si.geilicdn.com;
    proxy_ssl_server_name on;
    proxy_ssl_name si.geilicdn.com;
    proxy_set_header Host si.geilicdn.com;
    proxy_set_header Referer "https://weidian.com/";
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Accept "image/avif,image/webp,image/*,*/*;q=0.8";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_intercept_errors on;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable";
    add_header X-Img-Proxy "hipobuyspreadsheet" always;
    access_log off;
}
