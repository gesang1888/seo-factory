# HipoBuy platform opt — Phase C country cap keeps only .nl + .co.uk
# hipobuy.at → https://hipobuyspreadsheet.net$request_uri
server
{
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;
    server_name hipobuy.at www.hipobuy.at;
    include /www/server/panel/vhost/nginx/well-known/hipobuy.at.conf;
    ssl_certificate    /www/server/panel/vhost/cert/hipobuy.at/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/hipobuy.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        return 301 https://hipobuyspreadsheet.net$request_uri;
    }
    access_log  /www/wwwlogs/hipobuy.at.log;
    error_log  /www/wwwlogs/hipobuy.at.error.log;
}
