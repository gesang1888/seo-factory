server {
    listen 80;
    listen [::]:80;
    server_name hipobuyreview.com www.hipobuyreview.com;
    include /www/server/panel/vhost/nginx/well-known/hipobuyreview.com.conf;
    location = /index.html { return 301 https://hipobuyreview.com/; }
    location = /index.htm { return 301 https://hipobuyreview.com/; }
    include /www/server/panel/vhost/nginx/extension/hipobuyreview.com/*.conf;
    location / {
        return 301 https://hipobuyreview.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.hipobuyreview.com;
    ssl_certificate    /www/server/panel/vhost/cert/hipobuyreview.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/hipobuyreview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /index.html { return 301 https://hipobuyreview.com/; }
    location = /index.htm { return 301 https://hipobuyreview.com/; }
    include /www/server/panel/vhost/nginx/extension/hipobuyreview.com/*.conf;
    location / {
        return 301 https://hipobuyreview.com$request_uri;
    }
}

server
{
    listen 443 ssl;
    http2 on;
    server_name hipobuyreview.com;
    index index.html;
    root /www/wwwroot/hipobuyreview.com;
    charset utf-8;

    ssl_certificate    /www/server/panel/vhost/cert/hipobuyreview.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/hipobuyreview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # Apex: if ($request_uri) — NOT location=/index.html (breaks try_files / index)
    if ($request_uri ~* "^/index\.html?(\?|$)") {
        return 301 https://hipobuyreview.com/;
    }
    if ($request_uri ~* "^/(.+)/index\.html?(\?|$)") {
        return 301 https://hipobuyreview.com/$1/;
    }

    include /www/server/panel/vhost/nginx/well-known/hipobuyreview.com.conf;
    include /www/server/panel/vhost/nginx/extension/hipobuyreview.com/*.conf;
    include enable-php-74.conf;
    include /www/server/panel/vhost/rewrite/hipobuyreview.com.conf;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /favicon.ico {
        root /www/wwwroot/hipobuyreview.com;
        try_files /favicon.ico /assets/images/favicon.png /assets/images/favicon-64.png =404;
        access_log off;
        expires 30d;
    }

    location /api/ {
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.well-known {
        allow all;
    }

    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.git) {
        return 404;
    }

    location ^~ /.bak {
        return 404;
    }

    access_log /www/wwwlogs/hipobuyreview.com.log;
    error_log /www/wwwlogs/hipobuyreview.com.error.log;
}
