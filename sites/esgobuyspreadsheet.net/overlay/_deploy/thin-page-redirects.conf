# Step 3 2026-10-26: thin shipping/customs cleanup (deduped against gsc-redirects)
location = /blog/posts/esgobuy-customs-guide { return 301 https://esgobuyspreadsheet.net/esgobuy-shipping-guide/; }
location = /blog/posts/esgobuy-customs-guide/ { return 301 https://esgobuyspreadsheet.net/esgobuy-shipping-guide/; }

# Platform opt 2026-10-26: coupons aliases + public JSON/dataset
# Brand hub only — no country desks; do not revive Phase C sunsets.
location = /coupons.html { return 301 https://esgobuyspreadsheet.net/esgobuy-coupons/; }
location = /coupons/ { return 301 https://esgobuyspreadsheet.net/esgobuy-coupons/; }
location = /coupons { return 301 https://esgobuyspreadsheet.net/esgobuy-coupons/; }
location = /esgobuy-coupon/ { return 301 https://esgobuyspreadsheet.net/esgobuy-coupons/; }
location = /esgobuy-coupon { return 301 https://esgobuyspreadsheet.net/esgobuy-coupons/; }

location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/esgobuyspreadsheet.net/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/esgobuyspreadsheet.net/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
location ^~ /esgobuy-coupons/ {
  try_files $uri $uri/ /esgobuy-coupons/index.html;
}
