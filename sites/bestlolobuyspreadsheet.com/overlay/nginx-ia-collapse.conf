# indie-agent-redesign: collapse cookie-cutter variants on bestlolobuyspreadsheet.com
rewrite ^/lolobuy-spreadsheet(?:-2026)?/?$ / permanent;
rewrite ^/lolobuy-shoes-spreadsheet/?$ / permanent;
rewrite ^/lolobuy-community/?$ / permanent;
rewrite ^/lolobuy-coupons/?$ /coupons/ permanent;
rewrite ^/lolobuy-invite-code/?$ /coupons/ permanent;
rewrite ^/lolobuy-shipping-guide/?$ /shipping/ permanent;
rewrite ^/lolobuy-qc-guide/?$ /shipping/ permanent;
rewrite ^/lolobuy-refund-guide/?$ /shipping/ permanent;
rewrite ^/how-to-use-lolobuy/?$ /start/ permanent;
rewrite ^/is-lolobuy-legit/?$ /start/ permanent;
rewrite ^/blog/?$ / permanent;
rewrite ^/spreadsheet/?$ / permanent;
location ^~ /brand/ { add_header X-Robots-Tag "noindex, follow" always; try_files $uri $uri/ $uri/index.html =404; }
location ^~ /category/ { add_header X-Robots-Tag "noindex, follow" always; try_files $uri $uri/ $uri/index.html =404; }
