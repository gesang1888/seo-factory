# Platform opt 2026-10-26: coupons aliases + public JSON/dataset
location = /coupons.html { return 301 https://bestmulebuysheets.com/mulebuy-coupons/; }
location = /coupons/ { return 301 https://bestmulebuysheets.com/mulebuy-coupons/; }
location = /mulebuy-coupon/ { return 301 https://bestmulebuysheets.com/mulebuy-coupons/; }
location = /mulebuy-coupon { return 301 https://bestmulebuysheets.com/mulebuy-coupons/; }

location = /data/finds-dataset.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/bestmulebuysheets.com/data/finds-dataset.json;
}
location = /data/coupons-truth.json {
  default_type application/json;
  add_header Cache-Control "public, max-age=300";
  alias /www/wwwroot/bestmulebuysheets.com/data/coupons-truth.json;
}
location ^~ /finds-dataset/ {
  try_files $uri $uri/ /finds-dataset/index.html;
}
location ^~ /mulebuy-coupons/ {
  try_files $uri $uri/ /mulebuy-coupons/index.html;
}
