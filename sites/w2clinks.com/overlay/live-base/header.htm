<script>
window.W2C_IMAGES = {
  thumb: function (url, width) {
    if (!url) return '';
    if (url.charAt(0) === '/' && String(url).indexOf('geilicdn.com') === -1) return url;
    if (String(url).indexOf('geilicdn.com') === -1) return url;
    try {
      var raw = url.indexOf('/wd-img/') >= 0 ? ('https://' + url.replace(/^.*\/wd-img\//, '')) : url;
      var u = new URL(raw, location.origin);
      if (!/\.geilicdn\.com$/i.test(u.hostname) && u.hostname !== 'geilicdn.com') return url;
      return '/wd-img/' + u.hostname + u.pathname + '?imageView2/2/w/' + Math.max(80, Math.min(800, width || 400));
    } catch (e) {
      return url;
    }
  },
  fallback: function (img) {
    if (!img || img.dataset.wdFb) return;
    var src = img.getAttribute('src') || '';
    var i = src.indexOf('/wd-img/');
    if (i === -1) return;
    img.dataset.wdFb = '1';
    img.src = 'https://' + src.slice(i + 8).replace(/\?.*$/, '');
  }
};
(function () {
  function rewrite(img) {
    var src = img.getAttribute('src') || '';
    if (src.indexOf('geilicdn.com') === -1) return;
    var next = window.W2C_IMAGES.thumb(src);
    if (next && next !== src) img.setAttribute('src', next);
  }
  function scan(root) {
    if (root && root.tagName === 'IMG') rewrite(root);
    (root && root.querySelectorAll ? root.querySelectorAll('img') : []).forEach(rewrite);
  }
  function boot() { scan(document); }
  document.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'IMG') window.W2C_IMAGES.fallback(e.target);
  }, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
