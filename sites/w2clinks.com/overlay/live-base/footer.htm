(function () {
  var path = location.pathname || "/";
  document.querySelectorAll(".w2c-tabbar a").forEach(function (a) {
    var href = a.getAttribute("href") || "";
    if (href === "/" && (path === "/" || path === "")) a.classList.add("is-active");
    else if (href !== "/" && path.indexOf(href) === 0) a.classList.add("is-active");
  });
})();
</script>
