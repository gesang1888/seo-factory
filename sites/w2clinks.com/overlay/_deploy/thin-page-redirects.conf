# W2C platform opt 2026-10-26 — thin aliases + public JSON (avoid CMS /data/ collision)
location = /coupons.html { return 301 /agents/; }
location = /coupons/ { return 301 /agents/; }
location = /w2c-coupons/ { return 301 /agents/; }
location = /w2c-coupons { return 301 /agents/; }

# Static finds-dataset HTML (server index is index.php only — force HTML)
location = /finds-dataset { return 301 /finds-dataset/; }
location ^~ /finds-dataset/ {
  root /www/wwwroot/w2clinks.com;
  index index.html;
  try_files $uri $uri/ =404;
}

# Public moat JSON (CMS uses /data/ for runtime — alias only these two filenames)
location = /data/finds-dataset.json {
  alias /www/wwwroot/w2clinks.com/w2c-data/finds-dataset.json;
  default_type application/json;
  add_header Cache-Control "public, max-age=3600";
}
location = /data/coupons-truth.json {
  alias /www/wwwroot/w2clinks.com/w2c-data/coupons-truth.json;
  default_type application/json;
  add_header Cache-Control "public, max-age=3600";
}
